name: 功能建议
description: 提议新能力或行为变更
title: "[feat] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        本包的定位刻意保持窄：把 Laravel 具名路由按层级暴露给 SPA，并生成 TypeScript 类型。
        超出这个定位的能力（例如通用 API 网关、OpenAPI 桥接、前端构建插件）此前已明确拒绝或砍掉，
        以维持路线图诚实——这不是敷衍，是维护成本与正确性的权衡。请先把**真实使用场景**讲清楚。

  - type: textarea
    id: scenario
    attributes:
      label: 真实使用场景（没有场景的建议会被关闭）
      description: 你在什么项目、哪一步被卡住、不使用本包时如何解决
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的能力
      description: 请给出具体的配置片段 / 端点响应形状 / 命令输出，而不是一句抽象诉求
      render: php
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 该变更落在哪一层
      description: 框架无关逻辑应进 route-forge/common，Laravel 绑定留在本包（见 AGENTS.md）
      options:
        - "本包（Laravel 适配层：路由注册、中间件、Blade、命令接线）"
        - "route-forge/common（层级解析、别名、仓库、缓存、类型生成、摘要、异常）"
        - "不确定，请维护者判断"
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 是否需要破坏现有行为
      options:
        - "纯新增，现有行为不变"
        - "会改变默认行为（请在下面说明影响面）"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 现有能力（层级 match 规则、classifier 回调、别名、endpoint_middleware）能否组合达成？
    validations:
      required: false
